<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Off the chart — Ashmit Saxena</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0d0f10" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background-color: #0d0f10;
        background-image:
          linear-gradient(rgb(232 236 230 / 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgb(232 236 230 / 0.05) 1px, transparent 1px);
        background-size: 120px 120px;
        color: #e8ece6;
        font: 16px/1.5 system-ui, sans-serif;
      }
      main { max-width: 640px; }
      svg { width: 72px; height: 72px; color: #e3401c; animation: turn 14s linear infinite; }
      @keyframes turn { to { rotate: 360deg; } }
      @media (prefers-reduced-motion: reduce) { svg { animation: none; } }
      .code { margin: 28px 0 6px; font: 500 12px/1 ui-monospace, monospace; letter-spacing: 0.2em; text-transform: uppercase; color: rgb(232 236 230 / 0.6); }
      h1 { margin: 0; font: italic 900 clamp(44px, 9vw, 88px)/0.9 system-ui, sans-serif; text-transform: uppercase; letter-spacing: -0.01em; }
      p { margin: 18px 0 0; color: rgb(232 236 230 / 0.75); }
      a { display: inline-block; margin-top: 30px; padding: 12px 18px; border: 1px solid rgb(232 236 230 / 0.35); color: #efe2c4; text-decoration: none; font: 700 13px/1 system-ui, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; }
      a:hover { border-color: #efe2c4; }
      a:focus-visible { outline: 2px solid #e8b143; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <circle cx="20" cy="20" r="10" stroke="currentColor" stroke-width="1.2" />
        <path d="M20 2v36M2 20h36" stroke="currentColor" stroke-width="1.2" />
        <circle cx="20" cy="20" r="4" fill="currentColor" />
      </svg>
      <p class="code">Error 404 · Plate not found</p>
      <h1>Off the chart</h1>
      <p>This sector isn't on the drafting sheet. The page may have moved, or the link was mistyped.</p>
      <a href="/">Return to the poster</a>
    </main>
  </body>
</html>
